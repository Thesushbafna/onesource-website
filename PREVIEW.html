 `<section class="hero"><div><div class="eyebrow">THE ONE SOURCE COMMAND CENTRE</div><h2>One view. Every moving part.</h2><p>From the first enquiry to the final collection, keep your people,<br class="desktop"> materials and money moving in the same direction.</p></div><div class="hero-meta"><div class="tiny" style="color:#a3b8c8">ACTIVE PROJECTS</div><div class="big">${S.projects.filter(p=>p.status==='Active').length.toString().padStart(2,'0')} <span style="font-size:12px;font-weight:400;letter-spacing:0;color:#aac1ce">on the floor</span></div>${btn('View project workspace','nav','projects','','arrow')}</div></section>`+
 `<div class="kpi-grid">${kpi('Unbilled order book',C(pending),`${orders.length} approved sales orders`,'document')}${kpi('Trade receivables',C(sum(inv,'outstanding')),`<span class="${overdue.length?'negative':'positive'}">${C(sum(overdue,'outstanding'))} overdue</span>`,'wallet')}${kpi('Bank / cash book',C(S.reports.bank),'Book balance \u00b7 not bank-reconciled','book')}${kpi('Booked operating result',C(S.reports.profit),'Posted revenue less posted expenses','chart')}</div>`+
 `<div class="dashboard-main"><section class="card"><div class="card-head"><div><h3>Projects at a glance</h3><p>Billing progress against approved order value</p></div>${btn('View all','nav','projects','ghost sm','arrow')}</div>${table(['Project','Billing progress','>Booked margin'],S.projects.slice().reverse(),p=>{const os=orders.filter(o=>o.project_id===p.id),ov=sum(os,'base'),progress=ov?Math.min(100,Math.round(p.revenue/ov*100)):0;return `<tr><td>${link(p.name,'project-detail',p.id)}<div class="sub">${E(p.city)} &nbsp; ${badge(p.status)}</div></td><td><div class="between tiny muted" style="margin-bottom:6px"><span>${progress}% billed</span><span>${C(ov)}</span></div><div class="progress"><i style="width:${progress}%"></i></div></td><td class="right bold ${p.profit>=0?'positive':'negative'}">${C(p.profit)}</td></tr>`;})}<div class="panel-footer"><span>Cost includes dispatched stock and accrued labour.</span><span>${C(booked)} approved</span></div></section>
 <section class="card"><div class="card-head"><div><h3>Needs your attention</h3><p>Small follow-ups. Big difference.</p></div><span class="badge orange">${overdue.length+blockers.length+pods.length+unapproved.length} actions</span></div><div class="card-body">${[[overdue.length,'Overdue customer invoices','Collect before the ageing grows.','wallet','red','billing','receivables'],[blockers.length,'Site clearances waiting','Check MEP before mobilising crews.','shield','orange','clearances',''],[pods.length,'Delivery proof pending','Close the loop on dispatch.','truck','teal','dispatch',''],[unapproved.length,'Commercial approvals','Review quotations and orders.','document','teal','sales','quotes']].map(([n,t,d,i,col,dest,tab])=>`<div class="alert-row" data-action="nav" data-id="${dest}" data-extra="${tab}" role="button" tabindex="0"><span class="alert-icon ${col}">${ic(i)}</span><div><div class="alert-title">${t}</div><div class="alert-desc">${d}</div></div><span class="alert-num">${n.toString().padStart(2,'0')}</span></div>`).join('')}</div></section></div>`+
 `<div class="dashboard-bottom"><section class="card"><div class="card-head"><div><h3>Sales pipeline</h3><p>${openLeads.length} open opportunities \u00b7 ${C(sum(openLeads,'value'))} potential</p></div>${btn('Open pipeline','nav','pipeline','ghost sm','arrow')}</div><div class="card-body">${['New','Qualified','Quoted','Negotiation'].map(stage=>{const a=openLeads.filter(l=>l.stage===stage),max=Math.max(...['New','Qualified','Quoted','Negotiation'].map(st=>sum(openLeads.filter(l=>l.stage===st),'value')),1);return `<div class="pipe-stage"><span>${stage}</span><div class="pipe-bar"><i style="width:${Math.max(4,sum(a,'value')/max*100)}%">${a.length}</i></div><span class="right bold">${C(sum(a,'value'))}</span></div>`;}).join('')}</div><div class="panel-footer"><span>Weighted by each opportunity\u2019s probability.</span><strong class="positive">${C(sum(openLeads,l=>Math.round(l.value*l.probability/100)))} weighted</strong></div></section>
 <section class="card"><div class="card-head"><div><h3>Next up</h3><p>Your team\u2019s open commitments</p></div>${btn('All tasks','nav','tasks','ghost sm','arrow')}</div><div class="card-body">${S.tasks.filter(t=>t.status!=='Done').sort((a,b)=>a.due_date.localeCompare(b.due_date)).slice(0,4).map(t=>`<div class="mini-task"><button class="check-btn" data-action="complete-task" data-id="${t.id}" aria-label="Complete ${E(t.title)}"></button><div style="flex:1"><div style="font-size:11px;font-weight:550">${E(t.title)}</div><div class="tiny muted" style="margin-top:3px">${E(t.owner)} &nbsp; / &nbsp; <span class="${t.due_date<S.today?'negative':''}">${datef(t.due_date)}</span></div></div>${badge(t.priority)}</div>`).join('')||empty('All caught up','No open follow-ups.')}</div></section></div>`;}
function pipeline(){const open=S.leads.filter(l=>!['Won','Lost'].includes(l.stage));return head('A stronger sales pipeline.','Track the conversation, the next follow-up and the value at stake.',can('sales','operations','accounts')?btn('New opportunity','new','leads','primary','plus'):'','SALES / CRM')+`<div class="kpi-grid">${kpi('Open pipeline',C(sum(open,'value')),`${open.length} opportunities`,'pipeline')}${kpi('Weighted forecast',C(sum(open,l=>Math.round(l.value*l.probability/100))),'Probability-adjusted, not booked sales','chart')}${kpi('Follow-ups due',open.filter(l=>l.next_date<=S.today).length,'Open opportunities due today or earlier','clock')}${kpi('Won opportunities',S.leads.filter(l=>l.stage==='Won').length,'Won stage does not create an order','check')}</div><div class="kanban">${['New','Qualified','Quoted','Negotiation','Won','Lost'].map(stage=>`<div class="kanban-col"><div class="kanban-head"><span>${stage}</span><span class="badge">${S.leads.filter(l=>l.stage===stage).length}</span></div>${S.leads.filter(l=>l.stage===stage).map(l=>`<article class="lead-card" data-action="lead-detail" data-id="${l.id}" role="button" tabindex="0"><span class="tag">${E(l.scope||'New enquiry')}</span><h3>${E(l.company)}</h3><p>${E(l.contact||'Contact to be added')}</p><div class="lead-value">${C(l.value)}</div><div class="between tiny muted"><span>${E(l.owner)}</span><span>${l.probability}% probability</span></div><div class="lead-foot"><span>${ic('clock')} ${datef(l.next_date)}</span><span>${l.next_date<S.today&&!['Won','Lost'].includes(stage)?'<span class="negative">Follow up</span>':'View details'}</span></div></article>`).join('')}</div>`).join('')}</div>`;}
function documentTable(docs){return table(['Document','Customer / supplier','Project','Status','>Total',''],docs,d=>`<tr><td>${link(d.number,'doc-detail',d.id)}<div class="sub">${datef(d.date)}</div></td><td>${E(party(d.party_id))}<div class="sub">${E(d.reference||'No external reference')}</div></td><td>${E(project(d.project_id))}</td><td>${badge(d.status)}</td><td class="right bold">${R(d.total)}</td><td class="right">${btn('Open','doc-detail',d.id,'sm')}</td></tr>`);}
function sales(){const tab=tabs.sales||'quotes';return head('From enquiry to confirmed order.','Create itemised quotations, approve them and convert without re-entering the details.',can('sales')?btn(tab==='orders'?'New sales order':'New quotation','new-doc',tab==='orders'?'sales_order':'quote','primary','plus'):'','SALES / COMMERCIAL')+tabbar([['quotes','Quotations'],['orders','Sales orders']],'quotes')+`<div class="toolbar"><span class="toolbar-label">${tab==='orders'?'Approved orders can be dispatched and progressively billed.':'Approval is required before converting a quotation to a sales order.'}</span>${btn('Export register','export','documents','','download')}</div><section class="card">${documentTable(S.documents.filter(d=>d.type===(tab==='orders'?'sales_order':'quote')))}</section>`;}
function parties(){return head('The people behind every project.','Customers, suppliers, contacts and a linked control-ledger statement.',can('sales','operations','accounts')?btn('Add customer / vendor','new','parties','primary','plus'):'','CRM / CONTACTS')+`<div class="card">${table(['Company','Type','Contact','State / GSTIN','Terms',''],S.parties,p=>`<tr><td>${link(p.name,'party-detail',p.id)}<div class="sub">${E(p.address||'Address not set')}</div></td><td>${badge(p.type)}</td><td>${E(p.email||'--')}<div class="sub">${E(p.phone||'')}</div></td><td>${E(p.state||'--')}<div class="sub">${E(p.gstin||'GSTIN not provided')}</div></td><td>${p.credit_days} days</td><td>${btn('Statement','party-detail',p.id,'sm')}</td></tr>`)}</div>`;}
function purchasing(){const tab=tabs.purchasing||'orders';return head('Purchase with a clear paper trail.','Approved PO \u2192 partial goods receipt \u2192 matched supplier bill.',can('operations')?btn('New purchase order','new-doc','purchase_order','primary','plus'):'','OPERATIONS / PROCUREMENT')+tabbar([['orders','Purchase orders'],['receipts','Goods receipts'],['bills','Supplier bills']],'orders')+(tab==='orders'?`<section class="card">${documentTable(S.documents.filter(d=>d.type==='purchase_order'))}</section>`:tab==='bills'?`<div class="toolbar"><span class="toolbar-label">Material bills are created from goods receipts. Service bills are entered directly.</span>${can('accounts')?btn('New service bill','new-doc','bill','','plus'):''}</div><section class="card">${documentTable(S.documents.filter(d=>d.type==='bill'))}</section>`:`<section class="card">${table(['Receipt','Purchase order','Warehouse','Received','Reference',''],S.receipts,r=>{const bill=S.documents.find(d=>d.receipt_id===r.id&&['Draft','Posted'].includes(d.status));return `<tr><td>${E(r.number)}</td><td>${link(find('documents',r.document_id)?.number,'doc-detail',r.document_id)}</td><td>${E(find('warehouses',r.warehouse_id)?.name)}</td><td>${datef(r.date)}</td><td>${E(r.reference||'--')}</td><td>${bill?btn('View bill','doc-detail',bill.id,'sm'):can('accounts')?btn('Create matched bill','bill-receipt',r.id,'primary sm'):badge('Unbilled')}</td></tr>`;})}</section>`);}
function inventory(){const tab=tabs.inventory||'stock';const actions=(can('operations','accounts')?btn('New item','new','items','','plus'):'')+(can('operations')?btn('Transfer stock','stock-form','transfer_stock','','change'):'')+(can()?btn('Opening stock','stock-form','opening_stock','primary','plus'):'');return head('Stock you can actually trust.','Location-wise quantities and moving-average valuation. Negative stock is blocked.',actions,'OPERATIONS / MATERIALS')+`<div class="kpi-grid">${kpi('Inventory book value',C(sum(S.stock,'value')),'Reconciled to the inventory ledger','box')}${kpi('Stock SKUs',S.items.filter(i=>i.kind==='Stock').length,`${S.items.filter(i=>i.kind==='Service').length} service items`,'document')}${kpi('Low-stock SKUs',S.items.filter(i=>i.kind==='Stock'&&sum(S.stock.filter(s=>s.item_id===i.id),'qty_milli')<i.reorder_milli).length,'Across all stores combined','warning')}${kpi('Stores / warehouses',S.warehouses.length,'Same GST registration only','building')}</div>`+tabbar([['stock','Stock by location'],['catalog','Item catalogue'],['moves','Stock movements']],'stock')+(tab==='stock'?`<div class="card">${table(['SKU / material','Warehouse','>On hand','>Average cost','>Value','Status'],S.stock,r=>`<tr><td>${E(r.name)}<div class="sub">${E(r.sku)}</div></td><td>${E(r.warehouse)}</td><td class="right bold">${Q(r.qty_milli)} ${E(r.uom)}</td><td class="right">${r.qty_milli?R(r.value*1000/r.qty_milli):'--'}</td><td class="right">${R(r.value)}</td><td>${r.qty_milli===0?badge('No stock'):r.qty_milli<r.reorder_milli?'<span class="badge orange">Below SKU threshold</span>':badge('Available')}</td></tr>`)}</div>`:tab==='catalog'?`<div class="card">${table(['SKU','Description','Type / unit','HSN / SAC','>Sale rate','>Buy rate','>GST'],S.items,i=>`<tr><td>${E(i.sku)}</td><td>${link(i.name,'edit-master',i.id,'items')}<div class="sub">${E(i.category)}</div></td><td>${badge(i.kind)} ${E(i.uom)}</td><td>${E(i.hsn||'Not set')}</td><td class="right">${R(i.sell_rate)}</td><td class="right">${R(i.buy_rate)}</td><td class="right">${i.gst_bps/100}%</td></tr>`)}</div>`:`<div class="toolbar"><span class="toolbar-label">Latest 500 movements shown. Export contains the complete movement history.</span>${btn('Export movements','export','stock_moves','','download')}</div><div class="card">${table(['Date','Material','Warehouse','Movement','>Quantity','>Value'],S.stock_moves,r=>`<tr><td>${datef(r.date)}</td><td>${E(find('items',r.item_id)?.name)}</td><td>${E(find('warehouses',r.warehouse_id)?.name)}</td><td>${badge(r.source)}</td><td class="right ${r.qty_milli>0?'positive':'negative'}">${Q(r.qty_milli)}</td><td class="right">${R(r.value)}</td></tr>`)}</div>`);}
function dispatchView(){return head('From your store to their site.','Dispatch against approved orders, then capture delivery acknowledgement.',btn('Open sales orders','nav','sales','','document','orders'),'OPERATIONS / FULFILMENT')+`<div class="card">${table(['Dispatch','Sales order / customer','Vehicle / transporter','Dispatch date','POD',''],S.dispatches,d=>{const order=find('documents',d.document_id);return `<tr><td>${E(d.number)}<div class="sub">${E(find('warehouses',d.warehouse_id)?.name)}</div></td><td>${link(order?.number,'doc-detail',order?.id)}<div class="sub">${E(party(order?.party_id))}</div></td><td>${E(d.vehicle||'Not recorded')}<div class="sub">${E(d.transporter||'')}</div></td><td>${datef(d.date)}</td><td>${d.pod_ref?badge('Received'):'<span class="badge orange">Pending POD</span>'}<div class="sub">${E(d.pod_ref||'')}</div></td><td>${btn(d.pod_ref?'View / update POD':'Record POD','pod-form',d.id,'sm')}</td></tr>`;})}</div>`;}
function projects(){return head('Every site. One project view.','Clearance, manpower, variations and booked project profitability in one place.',can('operations','accounts')?btn('New project','new','projects','primary','plus'):'','OPERATIONS / PROJECTS')+`<div class="project-grid">${S.projects.map(p=>`<article class="card project-card"><div class="between"><span class="tag">${E(p.code)}</span>${badge(p.status)}</div><h2>${E(p.name)}</h2><p>${E(p.city)} &nbsp; / &nbsp; ${E(p.scope)}</p><div class="project-numbers"><div><div class="label">Booked revenue</div><div class="amount">${C(p.revenue)}</div></div><div><div class="label">Booked project cost</div><div class="amount">${C(p.cost)}</div></div><div><div class="label">Booked margin</div><div class="amount ${p.profit>=0?'positive':'negative'}">${C(p.profit)}</div></div><div><div class="label">Cost budget</div><div class="amount">${C(p.budget)}</div></div></div><div class="between tiny muted" style="margin-bottom:7px"><span>Cost vs budget</span><span>${p.budget?Math.round(p.cost/p.budget*100):0}%</span></div><div class="progress"><i style="width:${p.budget?Math.min(100,p.cost/p.budget*100):0}%"></i></div><div class="project-footer between"><span>${ic('clock')} Target ${datef(p.target_date)}</span>${btn('Open project','project-detail',p.id,'sm','arrow')}</div></article>`).join('')||empty()}</div>`;}
function clearances(){return head('Clear the site. Then send the team.','Track area-level readiness, blocked trades and who owns the next move.',can('operations','accounts')?btn('Add clearance','new','clearances','primary','plus'):'','SITE EXECUTION / READINESS')+`<section class="card">${table(['Project / area','Trade','Status','Required by','Blocker / owner',''],S.clearances,r=>`<tr><td><strong>${E(r.area)}</strong><div class="sub">${E(project(r.project_id))}</div></td><td>${E(r.trade||'--')}</td><td>${badge(r.status)}</td><td>${datef(r.required_date)}${r.cleared_date?`<div class="sub">Cleared ${datef(r.cleared_date)}</div>`:''}</td><td>${E(r.blocked_by||'No blocker noted')}<div class="sub">${E(r.owner)}</div></td><td>${btn('Update','edit-status',r.id,'sm','edit','clearances')}</td></tr>`)}</section>`;}
function labour(){const accr=sum(S.site_logs.filter(l=>l.journal_id),l=>l.headcount*l.daily_rate),idle=sum(S.site_logs.filter(l=>l.status==='Idle'),l=>l.headcount*l.daily_rate);return head('Know where every crew stands.','Record daily deployment, productive output, idle time and project labour accruals.',can('operations','accounts')?btn('Daily site log','new','site_logs','primary','plus'):'','SITE EXECUTION / MANPOWER')+`<div class="kpi-grid">${kpi('Today\u2019s deployment',sum(S.site_logs.filter(l=>l.date===S.today),'headcount'),'People across recorded teams','labour')}${kpi('Accrued labour',C(accr),'Posted to labour cost and payable','wallet')}${kpi('Recorded idle cost',C(idle),'Headcount \u00d7 daily rate; includes unposted logs','clock')}${kpi('Logs to accrue',S.site_logs.filter(l=>!l.journal_id).length,'Accounts approval needed','document')}</div><section class="card">${table(['Date / project','Team','>Headcount','Status','>Output','>Daily cost',''],S.site_logs,l=>`<tr><td>${datef(l.date)}<div class="sub">${E(project(l.project_id))}</div></td><td>${E(l.team)}<div class="sub">${E(l.hours)} hours recorded</div></td><td class="right">${l.headcount}</td><td>${badge(l.status)}</td><td class="right">${Q(l.output_milli)} ${E(l.uom)}</td><td class="right bold">${R(l.headcount*l.daily_rate)}</td><td>${l.journal_id?badge('Accrued'):can('accounts')?btn('Accrue cost','post-labour',l.id,'sm'):badge('Unposted')}</td></tr>`)}</section><div style="margin-top:15px">${notice('Labour cost is <strong>headcount \u00d7 daily rate</strong>; hours are informational. This is a project-cost log, not statutory payroll or attendance biometrics.')}</div>`;}
function changes(){return head('Recover the work beyond the work order.','Keep variations, rework, rate differences and debit disputes visible.',can('operations','accounts')?btn('Raise commercial change','new','changes','primary','plus'):'','COMMERCIAL / CHANGE CONTROL')+`<div class="report-summary">${kpi('Open commercial value',C(sum(S.changes.filter(x=>!['Rejected','Billed'].includes(x.status)),'value')),'Raised, submitted and approved changes','change')}${kpi('Approved to bill',C(sum(S.changes.filter(x=>x.status==='Approved'),'value')),'Requires an approved order / invoice','document')}${kpi('Rework exposure',C(sum(S.changes.filter(x=>x.type==='Rework'&&x.status!=='Rejected'),'value')),'Commercial tracker; not a ledger posting','warning')}</div><div class="card">${table(['Change','Project','Type','Status','>Value','Owner',''],S.changes,r=>`<tr><td>${E(r.title)}<div class="sub">${E(r.reference||'No reference')}</div></td><td>${E(project(r.project_id))}</td><td>${badge(r.type)}</td><td>${badge(r.status)}</td><td class="right bold">${R(r.value)}</td><td>${E(r.owner)}</td><td>${btn('Update','edit-status',r.id,'sm','edit','changes')}</td></tr>`)}</div><div style="margin-top:15px">${notice('A change marked Approved or Billed does not create revenue automatically. Create the relevant approved sales order and invoice to recognise the amount.')}</div>`;}
function tasks(){return head('Close the loop, every time.','Follow-ups for approvals, dispatch, collections and everything between.',can('sales','operations','accounts')?btn('New follow-up','new','tasks','primary','plus'):'','WORKSPACE / ACTIONS')+`<section class="card">${table(['Task','Project','Owner','Due','Priority','Status',''],S.tasks.slice().sort((a,b)=>(a.status==='Done')-(b.status==='Done')||a.due_date.localeCompare(b.due_date)),t=>`<tr><td>${E(t.title)}${t.notes?`<div class="sub">${E(t.notes)}</div>`:''}</td><td>${E(project(t.project_id))}</td><td>${E(t.owner)}</td><td class="${t.due_date<S.today&&t.status!=='Done'?'negative':''}">${datef(t.due_date)}</td><td>${badge(t.priority)}</td><td>${badge(t.status)}</td><td>${btn('Update','edit-status',t.id,'sm','edit','tasks')}</td></tr>`)}</section>`;}
function billing(){const tab=tabs.billing||'receivables';let ds=S.documents.filter(d=>d.status==='Posted'&&d.type===(tab==='payables'?'bill':'invoice'));let inv=S.documents.filter(d=>d.type==='invoice'&&d.status==='Posted'),bills=S.documents.filter(d=>d.type==='bill'&&d.status==='Posted');return head('Turn completed work into collected cash.','Keep trade balances, retention, TDS and advances separate.',can('accounts')?btn('Record settlement','settlement-form','','primary','plus'):'','FINANCE / RECEIVABLES & PAYABLES')+`<div class="kpi-grid">${kpi('Trade receivables',C(sum(inv,'outstanding')),'Excludes retention and TDS assets','wallet')}${kpi('Trade payables',C(sum(bills,'outstanding')),'Excludes retention and TDS liabilities','cart')}${kpi('Customer retention',C(sum(inv,'retained')),'Held amount remains separately collectible','shield')}${kpi('TDS receivable',C(balance('1120')),'Deducted by customers; not cash','book')}</div>`+tabbar([['receivables','Customer outstanding'],['payables','Supplier outstanding'],['invoices','Invoice register'],['settlements','Receipts & payments']],'receivables')+(tab==='settlements'?`<section class="card">${table(['Voucher / date','Party','Type / allocation','>Cash','>TDS','>Retention','Status',''],S.payments,p=>`<tr><td>${E(p.number)}<div class="sub">${datef(p.date)}</div></td><td>${E(party(p.party_id))}<div class="sub">${E(p.reference)}</div></td><td>${badge(p.direction==='in'?'Receipt':'Payment')}<div class="sub">${E(p.bucket)}${p.advance_used?' / advance '+R(p.advance_used):''}</div></td><td class="right">${R(p.cash)}</td><td class="right">${R(p.tds)}</td><td class="right">${R(p.retention)}</td><td>${badge(p.reversal_id?'Reversed':'Posted')}</td><td>${!p.reversal_id&&can('accounts')?btn('Reverse','reverse-form',p.id,'sm','','payments'):''}</td></tr>`)}</section>`:tab==='invoices'?`<div class="toolbar"><span class="toolbar-label">Material invoices originate from approved sales orders after dispatch.</span>${can('accounts')?btn('Direct service invoice','new-doc','invoice','','plus'):''}</div><section class="card">${documentTable(S.documents.filter(d=>d.type==='invoice'))}</section>`:`<section class="card">${table(['Invoice / bill','Party','Due date','>Total','>Outstanding','>Retention',''],ds,d=>`<tr><td>${link(d.number,'doc-detail',d.id)}<div class="sub">${E(project(d.project_id))}</div></td><td>${E(party(d.party_id))}</td><td>${datef(d.due_date)}${d.outstanding&&d.due_date<S.today?`<div class="sub">${badge('Overdue')}</div>`:''}</td><td class="right">${R(d.total)}</td><td class="right bold">${R(d.outstanding)}</td><td class="right">${R(d.retained)}</td><td>${can('accounts')&&(d.outstanding>0||d.retained>0)?btn('Settle','settlement-form',d.id,'sm'):badge('Settled')}</td></tr>`)}</section>`);}

function options(list,value){return list.map(x=>{const [v,label]=Array.isArray(x)?x:[x,x];return `<option value="${E(v)}" ${String(v)===String(value)?'selected':''}>${E(label)}</option>`;}).join('');}
function field(name,label,type='text',value='',opts=[],config={}){let input='';const req=config.required===false?'':'required',extra=config.extra||'';
 if(type==='select')input=`<select name="${name}" ${req} ${extra}>${options(opts,value)}</select>`;
 else if(type==='textarea')input=`<textarea name="${name}" ${req} ${extra}>${E(value)}</textarea>`;
 else input=`<input type="${type}" name="${name}" value="${E(value)}" ${req} ${type==='number'?'step="'+(config.step||'.01')+'" min="'+(config.min??0)+'"':''} ${extra}>`;
 return `<div class="field ${config.full?'span2':''}"><label for="f-${name}">${E(label)}</label>${input.replace(`name="${name}"`,`id="f-${name}" name="${name}"`)}${config.help?`<div class="field-help">${E(config.help)}</div>`:''}</div>`;}

function partyDetail(id){const p=find('parties',id);const control=['1100','1110','2000','2020','1300','2100'];const ls=S.journal_lines.filter(l=>l.party_id===p.id&&control.includes(l.account)).sort((a,b)=>{const da=find('journals',a.journal_id),db=find('journals',b.journal_id);return da.date.localeCompare(db.date)||a.id-b.id;});modal(p.name,`<div class="doc-summary"><div><label>CONTACT</label><p>${E(p.email||'--')}<br>${E(p.phone||'')}</p></div><div><label>GSTIN / STATE</label><p>${E(p.gstin||'Not set')} / ${E(p.state)}</p></div><div><label>TERMS</label><p>${p.credit_days} days</p></div></div><p class="small muted" style="margin-bottom:20px">${E(p.address)}</p><h3 style="margin-bottom:12px">Party control ledger</h3>${table(['Date / voucher','Account','>Debit','>Credit'],ls,l=>{const j=find('journals',l.journal_id);return `<tr><td>${datef(j.date)}<div class="sub">${E(j.number)}</div></td><td>${E(S.accounts.find(a=>a.code===l.account)?.name)}</td><td class="right">${l.debit?R(l.debit):'--'}</td><td class="right">${l.credit?R(l.credit):'--'}</td></tr>`;})}<div style="margin-top:16px">${notice('Includes trade, retention and advance control accounts. Customer debit balances are collectible; supplier credit balances are payable. TDS is reported separately.')}</div>`,btn('Close','close-modal')+(can('sales','operations','accounts')?btn('Edit contact','edit-master',id,'primary','edit','parties'):''),true);}
function projectDetail(id){const p=find('projects',id);modal(p.name,`<div class="between"><span class="tag">${E(p.code)}</span>${badge(p.status)}</div><div class="doc-summary"><div><label>CUSTOMER</label><p>${E(party(p.client_id))}</p></div><div><label>PROJECT OWNER</label><p>${E(p.owner)}</p></div><div><label>TARGET COMPLETION</label><p>${datef(p.target_date)}</p></div></div><div class="report-summary">${kpi('Booked revenue',C(p.revenue),'Posted invoices','chart')}${kpi('Booked cost',C(p.cost),'Stock, services, labour and expenses','wallet')}${kpi('Booked margin',C(p.profit),'Before period-end adjustments','book')}</div><div class="grid2"><div><h3 style="margin-bottom:10px">Site readiness</h3>${table(['Area','Status'],S.clearances.filter(x=>x.project_id===p.id),x=>`<tr><td>${E(x.area)}</td><td>${badge(x.status)}</td></tr>`)}</div><div><h3 style="margin-bottom:10px">Commercial changes</h3>${table(['Description','>Value','Status'],S.changes.filter(x=>x.project_id===p.id),x=>`<tr><td>${E(x.title)}</td><td class="right">${C(x.value)}</td><td>${badge(x.status)}</td></tr>`)}</div></div><h3 style="margin:24px 0 12px">Linked documents</h3>${documentTable(S.documents.filter(d=>d.project_id===p.id))}<div style="margin-top:18px">${notice(E(p.notes||'No additional project notes.'))}</div>`,btn('Close','close-modal')+btn('Update project','edit-status',p.id,'','edit','projects'),true);}
function attachmentSection(entity,id){const files=S.attachments.filter(a=>a.entity===entity&&a.record_id===Number(id));return `<div style="margin-top:25px"><div class="between"><h3>Supporting documents</h3>${can('sales','operations','accounts')?btn('Attach file','upload-form',id,'sm','clip',entity):''}</div>${files.map(a=>`<div class="attachment"><span>${ic('clip')} ${E(a.filename)} <span class="muted">(${(a.size/1024).toFixed(0)} KB)</span></span>${btn('Save file','attachment',a.id,'sm','download')}</div>`).join('')||'<p class="small muted" style="margin-top:8px">No attachments. Add the PO, approval, site evidence or delivery proof.</p>'}</div>`;}
function docBody(d,print=false){const p=find('parties',d.party_id);const ls=lines(d.id);return `<div class="doc-summary"><div><label>${['purchase_order','bill'].includes(d.type)?'SUPPLIER':'BILL TO / CUSTOMER'}</label><p><strong>${E(p.name)}</strong><br>${E(p.address||'Address not set')}<br>GSTIN: ${E(p.gstin||'Not set')}</p></div><div><label>REFERENCE & PROJECT</label><p>${E(d.reference||'No external reference')}<br>${E(project(d.project_id))}<br>Place of supply: ${E(d.place_of_supply||'Not set')}</p></div><div><label>DATES & TAX BASIS</label><p>Date: ${datef(d.date)}<br>Due / validity: ${datef(d.due_date)}<br>${d.tax_mode==='intra'?'CGST + SGST':d.tax_mode==='inter'?'IGST':'No tax calculated'}</p></div></div>${table(['Item / description','HSN / SAC','>Qty','Unit','>Rate','>Taxable','>GST','>Total'],ls,l=>`<tr><td>${E(l.description)}<div class="sub">${E(l.sku)}</div></td><td>${E(l.hsn||'--')}</td><td class="right">${Q(l.qty_milli)}</td><td>${E(l.uom)}</td><td class="right">${R(l.rate)}</td><td class="right">${R(l.base)}</td><td class="right">${R(l.cgst+l.sgst+l.igst)}</td><td class="right bold">${R(l.total)}</td></tr>`)}<div class="totals"><div><span>Taxable amount</span><span>${R(d.base)}</span></div>${d.tax_mode==='intra'?`<div><span>CGST</span><span>${R(d.cgst)}</span></div><div><span>SGST</span><span>${R(d.sgst)}</span></div>`:d.tax_mode==='inter'?`<div><span>IGST</span><span>${R(d.igst)}</span></div>`:''}<div class="grand"><span>Total</span><span>${R(d.total)}</span></div>${['invoice','bill'].includes(d.type)&&d.status==='Posted'?`<div><span>Trade outstanding</span><strong>${R(d.outstanding)}</strong></div><div><span>Retention outstanding</span><strong>${R(d.retained)}</strong></div>`:''}</div>${d.notes?`<div style="margin-top:25px"><h3>Notes / agreed terms</h3><p class="small muted" style="white-space:pre-wrap;margin-top:7px">${E(d.notes)}</p></div>`:''}${!print?attachmentSection('documents',d.id):''}`;}
function docDetail(id){const d=find('documents',id);if(!d)return;let actions=btn('Print / save PDF','print-doc',id,'','print');if(d.status==='Draft'&&['quote','sales_order','purchase_order'].includes(d.type)&&can('accounts'))actions+=btn('Approve','approve-doc',id,'primary','check');if(d.type==='quote'&&d.status==='Approved'&&can('sales'))actions+=btn('Convert to sales order','convert-order',id,'primary','arrow');if(d.type==='sales_order'&&d.status==='Approved'){if(can('operations'))actions+=btn('Dispatch material','dispatch-form',id,'','truck');if(can('accounts'))actions+=btn('Create invoice','invoice-from-order',id,'primary','document');}if(d.type==='purchase_order'&&d.status==='Approved'&&can('operations'))actions+=btn('Receive goods','receive-form',id,'primary','box');if(['invoice','bill'].includes(d.type)&&d.status==='Draft'&&can('accounts'))actions+=btn('Post to accounts','post-doc',id,'primary','book');if(['invoice','bill'].includes(d.type)&&d.status==='Posted'&&can('accounts'))actions+=btn('Settle','settlement-form',id,'primary','wallet')+btn('Reverse','reverse-form',id,'danger','','documents');if(d.status==='Draft')actions+=btn('Cancel draft','cancel-doc',id,'danger');const source=d.source_id?find('documents',d.source_id):null;
 modal(d.number,`<div class="between"><div class="flex">${badge(d.status)}<span class="tag">${E(d.type.replaceAll('_',' ').toUpperCase())}</span></div>${source?`<span class="small muted">From ${link(source.number,'doc-detail',source.id)}</span>`:''}</div><div style="margin-top:14px">${notice('Internal commercial / accounting record. No IRN, GST portal submission, e-way bill or statutory validation is generated.','warning')}</div>${docBody(d)}`,actions,true);}
function newDoc(type,leadId=null){const customer=!['bill','purchase_order'].includes(type);const lead=leadId?find('leads',leadId):null;const title={quote:'New quotation',sales_order:'New sales order',purchase_order:'New purchase order',invoice:'Direct service invoice',bill:'Direct service bill'}[type];const eligible=S.items.filter(i=>['invoice','bill'].includes(type)?i.kind==='Service':type==='purchase_order'?i.kind==='Stock':true);
 if(!eligible.length){toast('Add an eligible item in Inventory before creating this document.',true);return;}if(!partyOptions(customer?'Customer':'Supplier').length){toast('Add a customer / supplier account first.',true);return;}
 const body=`<input type="hidden" name="doc_type" value="${type}"><div class="form-grid">${field('party_id',customer?'Customer':'Supplier','select',lead?.party_id||'',partyOptions(customer?'Customer':'Supplier'))}${field('project_id','Project (optional)','select','',projectOptions(),{required:false})}${field('date','Document date','date',S.today)}${field('due_date','Due / validity date','date',new Date(new Date(S.today).getTime()+30*864e5).toISOString().slice(0,10))}${field('reference',customer?'Client PO / RFQ / WO reference':'Supplier invoice / PO reference','text','',[],{required:type==='bill'})}${field('tax_mode','Tax treatment (confirm applicability)','select','intra',[['intra','CGST + SGST (intra-state)'],['inter','IGST (inter-state)'],['none','No tax calculated']])}${field('place_of_supply','Place of supply - state code','text',S.settings.state)}<div class="form-section">Line items / bill of quantities</div></div><div class="table-wrap"><table class="line-table"><thead><tr><th style="width:36%">Material / service</th><th>Quantity</th><th>Rate (INR)</th><th>GST %</th><th></th></tr></thead><tbody id="doc-line-body" data-type="${type}"></tbody></table></div><div class="between" style="margin:10px 0 18px">${btn('Add line','add-doc-line','','sm','plus')}<div class="line-total" id="doc-estimate">${R(0)}</div></div><div class="form-grid">${field('notes','Terms, scope and exclusions','textarea',type==='quote'?'Suggested terms: 20% advance / 70% via LC (60 days) / 10% on handover. Subject to the agreed work order.':'',[],{required:false,full:true})}</div>${notice('All amounts are INR. Quantities use up to 3 decimals and rates use 2 decimals. Line taxes are rounded to paise. HSN, place of supply and rate applicability must be reviewed by accounts.')}`;
 formModal(lead?'Quotation for '+lead.company:title,body,data=>{const p={action:lead?'quote_from_lead':'create_document',type,lead_id:leadId,...data,lines:collectDocLines()};delete p.doc_type;return mutate(p);},true,'Create draft');addDocLine();}
function addDocLine(){const body=document.getElementById('doc-line-body');if(!body)return;const type=body.dataset.type;const eligible=S.items.filter(i=>['invoice','bill'].includes(type)?i.kind==='Service':type==='purchase_order'?i.kind==='Stock':true);const i=eligible[0];const tr=document.createElement('tr');tr.className='doc-line';tr.innerHTML=`<td><select class="line-input item-select" aria-label="Material or service">${options(eligible.map(x=>[x.id,x.sku+' - '+x.name]),i.id)}</select></td><td><input class="line-input doc-qty" aria-label="Quantity" type="number" min="0.001" step="0.001" value="1" required></td><td><input class="line-input doc-rate" aria-label="Rate in rupees" type="number" min="0" step="0.01" value="${(['bill','purchase_order'].includes(type)?i.buy_rate:i.sell_rate)/100}" required></td><td><input class="line-input doc-gst" aria-label="GST percentage" type="number" min="0" max="100" step="0.01" value="${i.gst_bps/100}" required></td><td><button type="button" class="icon-btn" data-action="remove-line" aria-label="Remove line">${ic('close')}</button></td>`;body.appendChild(tr);updateEstimate();}
function collectDocLines(){return [...document.querySelectorAll('.doc-line')].map(tr=>({item_id:tr.querySelector('.item-select').value,qty:tr.querySelector('.doc-qty').value,rate:tr.querySelector('.doc-rate').value,gst_rate:tr.querySelector('.doc-gst').value}));}
function updateEstimate(){const out=document.getElementById('doc-estimate');if(!out)return;const mode=document.querySelector('[name="tax_mode"]')?.value;const total=collectDocLines().reduce((s,l)=>{const b=Math.round(Number(l.qty)*Number(l.rate)*100),g=Number(l.gst_rate);return s+b+(mode==='intra'?2*Math.round(b*g/200):mode==='inter'?Math.round(b*g/100):0);},0);out.textContent='Est. total '+R(total);}
function orderMovement(id,kind){const d=find('documents',id);const all=lines(id);const rows=all.filter(l=>kind==='invoice'?(l.kind==='Stock'?l.dispatched_milli-l.invoiced_milli:l.qty_milli-l.invoiced_milli)>0:l.kind==='Stock'&&l.qty_milli-(kind==='receive'?l.received_milli:l.dispatched_milli)>0);if(!rows.length){toast(kind==='invoice'?'No billable quantity remains. Dispatch stock first.':'No outstanding material quantity remains.',true);return;}
 let body=`<div class="form-grid">${field('date',kind==='invoice'?'Invoice date':kind==='receive'?'Receipt date':'Dispatch date','date',S.today)}`;
 if(kind==='invoice')body+=field('due_date','Payment due','date',new Date(new Date(S.today).getTime()+(find('parties',d.party_id)?.credit_days||30)*864e5).toISOString().slice(0,10));
 else body+=field('warehouse_id','Warehouse / store','select',1,warehouseOptions());
 if(kind==='dispatch')body+=field('vehicle','Vehicle number','text','',[],{required:false})+field('transporter','Transporter / contact','text','',[],{required:false});
 if(kind==='receive')body+=field('reference','Supplier delivery challan / reference','text','',[],{required:false,full:true});
 body+=`</div><div style="margin:20px 0">${table(['Material / service','>Available','Quantity this time'],rows,l=>{const rem=kind==='invoice'?(l.kind==='Stock'?l.dispatched_milli-l.invoiced_milli:l.qty_milli-l.invoiced_milli):l.qty_milli-(kind==='receive'?l.received_milli:l.dispatched_milli);return `<tr><td>${E(l.description)}<div class="sub">${E(l.uom)}</div></td><td class="right">${Q(rem)}</td><td><input class="line-input movement-qty" data-line-id="${l.id}" aria-label="Quantity for ${E(l.description)}" type="number" min="0" max="${rem/1000}" step="0.001" value="${rem/1000}" required></td></tr>`;})}</div>${notice(kind==='invoice'?'Only dispatched stock and unbilled service quantities can be invoiced. An invoice draft does not post revenue until accounts posts it.':kind==='receive'?'Receiving adds stock and posts Inventory / Goods received not billed. The supplier bill is created from this receipt.':'Dispatch immediately reduces inventory and recognises material cost. Available stock is checked when saved. Stock returns are not implemented in this starter.','warning')}`;
 formModal((kind==='invoice'?'Invoice':kind==='receive'?'Receive against':'Dispatch against')+' '+d.number,body,data=>mutate({action:kind==='invoice'?'convert_document':kind,id,target:kind==='invoice'?'invoice':undefined,...data,lines:[...document.querySelectorAll('.movement-qty')].map(el=>({line_id:Number(el.dataset.lineId),qty:el.value}))}),true,kind==='invoice'?'Create invoice draft':kind==='receive'?'Receive & post accrual':'Dispatch & post cost');}
function billReceipt(id){const r=find('receipts',id);formModal('Supplier bill from '+r.number,`<div class="form-grid">${field('reference','Supplier invoice number')}${field('date','Bill posting date','date',S.today)}${field('due_date','Due date','date',new Date(new Date(S.today).getTime()+30*864e5).toISOString().slice(0,10))}</div><div style="margin-top:17px">${notice('The bill matches this entire receipt at the PO rate. Price variances, multiple GRNs on one supplier bill and partial GRN billing are not supported in this version.')}</div>`,data=>mutate({action:'bill_receipt',id,...data}),false,'Create matched bill');}
function podForm(id){const d=find('dispatches',id);formModal('Delivery acknowledgement | '+d.number,`<div class="form-grid">${field('pod_ref','POD / recipient reference','text',d.pod_ref,[],{full:true})}${field('pod_date','Acknowledged on','date',d.pod_date||S.today)}</div>${attachmentSection('dispatches',id)}`,data=>mutate({action:'update',entity:'dispatches',id,...data}),false,'Save POD');}
function stockForm(kind){const isOpen=kind==='opening_stock';const items=S.items.filter(i=>i.kind==='Stock');if(!items.length){toast('Create a stock item first.',true);return;}formModal(isOpen?'Opening stock balance':'Internal warehouse transfer',`<div class="form-grid">${field('item_id','Stock item','select','',items.map(i=>[i.id,i.sku+' - '+i.name]))}${field('date','Movement date','date',S.today)}${field('warehouse_id',isOpen?'Warehouse':'From warehouse','select','',warehouseOptions())}${isOpen?field('rate','Opening unit cost (INR)','number',0):field('to_warehouse_id','To warehouse','select','',warehouseOptions())}${field('qty','Quantity','number',1,[],{step:'.001',min:'.001'})}${field('notes','Reason / reference','textarea','',[],{required:false,full:true})}</div><div style="margin-top:16px">${notice(isOpen?'Opening stock posts Inventory against Capital / opening balances. Enter reviewed opening costs, not selling prices.':'Only use this for stores under the SAME GST registration. This does not create a tax invoice or e-way bill. No negative stock or backdated outbound movements.','warning')}</div>`,data=>mutate({action:kind,...data}),false,isOpen?'Post opening stock':'Transfer stock');}
function settlementForm(docid=''){const d=docid?find('documents',docid):null;const direction=d?.type==='bill'?'out':'in';const bucket=d&&d.outstanding===0&&d.retained>0?'retention':'trade';const docs=S.documents.filter(x=>['invoice','bill'].includes(x.type)&&x.status==='Posted');const body=`<div class="form-grid">${field('direction','Direction','select',direction,[['in','Receipt from customer'],['out','Payment to supplier']])}${field('bucket','Allocation type','select',bucket,[['trade','Against invoice / bill'],['retention','Collect / pay held retention'],['advance','Party advance - no invoice']])}${field('document_id','Invoice / bill','select',docid,[['','Select a document'],...docs.map(x=>[x.id,x.number+' | '+party(x.party_id)+' | Due '+C(x.outstanding)])],{required:false,full:true})}${field('party_id','Party (advances only)','select','',[['','Use party from invoice / bill'],...S.parties.map(x=>[x.id,x.name])],{required:false,full:true})}${field('date','Settlement date','date',S.today)}${field('reference','Bank / UTR / voucher reference','text','',[],{required:false})}${field('cash','Actual cash / bank amount (INR)','number',d?(bucket==='retention'?d.retained:d.outstanding)/100:0)}${field('tds','TDS withheld (INR)','number',0)}${field('retention','New retention withheld (INR)','number',0)}${field('advance_used','Apply available advance (INR)','number',0)}${field('memo','Narration','textarea','',[],{required:false,full:true})}</div><div style="margin-top:18px">${notice('Cash + TDS + new retention + advance applied cannot exceed trade outstanding. Retention collection is cash-only. Advances are recorded without GST calculation; any applicable advance tax needs separate accountant review.','warning')}</div>`;
 formModal('Record receipt / payment',body,data=>mutate({action:'settle',...data}),false,'Post settlement');}
function reverseForm(entity,id){formModal('Reverse accounting record',`<div class="form-grid">${field('date','Reversal posting date','date',S.today)}${field('reason','Reason for reversal','textarea','',[],{full:true})}</div><div style="margin-top:15px">${notice('The original entry is preserved and an equal opposite journal is posted. Reverse dependent settlements first. This is an internal reversal, NOT a GST credit note. No stock quantity is reversed.','warning')}</div>`,data=>mutate({action:'reverse',entity,id,...data}),false,'Post reversal');}
function journalForm(){formModal('New balanced journal / expense',`<div class="form-grid">${field('date','Posting date','date',S.today)}${field('project_id','Project cost centre (optional)','select','',projectOptions(),{required:false})}${field('party_id','Party (optional)','select','',[['','No party'],...S.parties.map(p=>[p.id,p.name])],{required:false})}${field('memo','Narration','text','',[],{full:true})}</div><div class="table-wrap" style="margin-top:18px"><table class="line-table"><thead><tr><th>Account</th><th>Debit (INR)</th><th>Credit (INR)</th><th></th></tr></thead><tbody id="journal-line-body"></tbody></table></div><div class="between" style="margin:15px 0">${btn('Add line','add-journal-line','','sm','plus')}<strong id="journal-balance" class="small">Difference: ${R(0)}</strong></div>${notice('Use this for capital, overheads, tax adjustments or paying accrued labour. AR, AP, stock, GRNI, retention and advance control accounts are blocked to keep their subledgers consistent.')}`,data=>mutate({action:'manual_journal',...data,lines:[...document.querySelectorAll('.journal-line')].map(tr=>({account:tr.querySelector('.journal-account').value,debit:tr.querySelector('.journal-debit').value,credit:tr.querySelector('.journal-credit').value}))}),true,'Post journal');addJournalLine();addJournalLine();}
function addJournalLine(){const body=document.getElementById('journal-line-body');if(!body)return;const excluded=['1100','1110','1200','1300','2000','2010','2020','2100'];const tr=document.createElement('tr');tr.className='journal-line';tr.innerHTML=`<td><select class="line-input journal-account" aria-label="Ledger account">${options(S.accounts.filter(a=>!excluded.includes(a.code)).map(a=>[a.code,a.code+' - '+a.name]),'1000')}</select></td><td><input class="line-input journal-debit" type="number" aria-label="Debit amount" min="0" step=".01" value="0"></td><td><input class="line-input journal-credit" type="number" aria-label="Credit amount" min="0" step=".01" value="0"></td><td><button class="icon-btn" type="button" data-action="remove-line" aria-label="Remove line">${ic('close')}</button></td>`;body.appendChild(tr);updateJournalBalance();}
function updateJournalBalance(){const label=document.getElementById('journal-balance');if(!label)return;const n=[...document.querySelectorAll('.journal-line')].reduce((s,tr)=>s+Math.round(Number(tr.querySelector('.journal-debit').value)*100)-Math.round(Number(tr.querySelector('.journal-credit').value)*100),0);label.textContent='Difference: '+R(n);label.className='small '+(n?'negative':'positive');}
function journalDetail(id){const j=find('journals',id);const ls=S.journal_lines.filter(l=>l.journal_id===j.id);const reversed=S.journals.some(x=>x.reverses_id===j.id);modal(j.number,`<div class="between"><span class="small muted">${datef(j.date)} / ${E(j.user_name)}</span>${badge(j.source)}</div><h3 style="margin:20px 0">${E(j.memo)}</h3>${table(['Ledger account','Party / project','>Debit','>Credit'],ls,l=>`<tr><td>${E(S.accounts.find(a=>a.code===l.account)?.name)}</td><td>${l.party_id?E(party(l.party_id)):'--'}<div class="sub">${l.project_id?E(project(l.project_id)):''}</div></td><td class="right">${l.debit?R(l.debit):'--'}</td><td class="right">${l.credit?R(l.credit):'--'}</td></tr>`)}<div class="totals"><div><strong>Total debit</strong><strong>${R(sum(ls,'debit'))}</strong></div><div><strong>Total credit</strong><strong>${R(sum(ls,'credit'))}</strong></div></div>`,btn('Close','close-modal')+(j.source==='manual'&&!reversed&&can('accounts')?btn('Reverse','reverse-form',id,'danger','','journals'):''),true);}
function ledgerDetail(code){const account=S.accounts.find(a=>a.code===String(code));const ls=S.journal_lines.filter(l=>l.account===String(code)).sort((a,b)=>{const x=find('journals',a.journal_id),y=find('journals',b.journal_id);return x.date.localeCompare(y.date)||a.id-b.id;});let running=0;modal(code+' | '+account.name,table(['Date / voucher','Narration','>Debit','>Credit','>Balance'],ls,l=>{const j=find('journals',l.journal_id);running+=l.debit-l.credit;return `<tr><td>${datef(j.date)}<div class="sub">${link(j.number,'journal-detail',j.id)}</div></td><td>${E(j.memo)}</td><td class="right">${l.debit?R(l.debit):'--'}</td><td class="right">${l.credit?R(l.credit):'--'}</td><td class="right">${R(Math.abs(running))} ${running>=0?'Dr':'Cr'}</td></tr>`;}),btn('Close','close-modal'),true);}
function settingsForm(){formModal('Company settings & period lock',`<div class="form-grid">${field('company_name','Legal company name','text',S.settings.company_name)}${field('tagline','Tagline','text',S.settings.tagline,[],{required:false})}${field('gstin','GSTIN','text',S.settings.gstin,[],{required:false})}${field('state','Registered state code','text',S.settings.state)}${field('email','Accounts email','email',S.settings.email,[],{required:false})}${field('phone','Phone','text',S.settings.phone,[],{required:false})}${field('address','Registered address','textarea',S.settings.address,[],{required:false,full:true})}${field('locked_through','Lock books through (inclusive)','date',S.settings.locked_through,[],{required:false,help:'Irreversible in this starter. Posting on or before this date will be blocked.'})}</div>`,data=>mutate({action:'save_settings',...data}),false,'Save settings');}
function userForm(){formModal('Add team member',`<div class="form-grid">${field('name','Full name')}${field('username','Username (no spaces)')}${field('role','Role','select','viewer',[['sales','Sales'],['operations','Operations'],['accounts','Accounts'],['viewer','Viewer'],['admin','Administrator']])}${field('password','Initial password (12+ characters)','password','',[],{extra:'minlength="12" autocomplete="new-password"'})}</div><div style="margin-top:15px">${notice('All roles can view all company data in this starter. Roles control write actions, not record-level or branch-level visibility. Do not use Viewer access for external customers or suppliers.','warning')}</div>`,data=>mutate({action:'create_user',...data}),false,'Create user');}
function passwordForm(){formModal('Change your password',`<div class="form-grid">${field('current_password','Current password','password','',[],{full:true,extra:'autocomplete="current-password"'})}${field('new_password','New password (12+ characters)','password','',[],{full:true,extra:'minlength="12" autocomplete="new-password"'})}</div>`,data=>mutate({action:'change_password',...data}),false,'Change password');}
function uploadForm(entity,id){formModal('Attach supporting document',`<div class="field"><label for="attachment-file">Choose a file (up to 5 MB)</label><input type="file" id="attachment-file" accept=".pdf,.png,.jpg,.jpeg,.webp,.xlsx,.docx,.txt" required><span class="field-help">Attachments are stored inside the database and included in backups. Download files only from trusted team members.</span></div>`,async()=>{const f=document.getElementById('attachment-file').files[0];if(!f||f.size>5*1024*1024)throw Error('Select a file up to 5 MB.');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(f);});if(PREVIEW)throw Error('Upload is disabled in the read-only preview.');const r=await api('/api/upload','POST',{entity,record_id:id,filename:f.name,data});await refresh();closeModal();toast(r.message);},false,'Upload attachment');}
function printDoc(id){const d=find('documents',id);let el=document.querySelector('.print-document');if(!el){el=document.createElement('div');el.className='print-document';document.body.appendChild(el);}el.innerHTML=`<div class="print-top"><div><h1>${E(S.settings.company_name)}</h1><p class="small">${E(S.settings.address||'Registered address not configured')}</p><p class="small">GSTIN: ${E(S.settings.gstin||'Not configured')}<br>${E(S.settings.email||'')} ${E(S.settings.phone||'')}</p></div><div class="right"><h2 class="print-title">${E(d.type.replaceAll('_',' ').toUpperCase())}</h2><p>${E(d.number)}</p><p class="print-caption">${E(d.status.toUpperCase())} / INTERNAL COPY</p></div></div>${notice('INTERNAL RECORD ONLY - NOT A STATUTORY TAX INVOICE. No IRN / e-invoicing, e-way bill or GST validation has been performed.','warning')}${docBody(d,true)}<div class="print-sign">For ${E(S.settings.company_name)}<br><br><br>Authorised signatory</div><p class="print-caption" style="margin-top:30px">Generated by One Source OS. ${S.settings.demo?'Fictional demonstration data. ':''}Amounts in INR. Confirm tax rates, registration details and contract terms before use.</p>`;window.print();}
function download(path){if(PREVIEW){toast('Downloads of live records require the full application. This preview contains only fictional sample data.',true);return;}const a=document.createElement('a');a.href=path;a.download='';document.body.appendChild(a);a.click();a.remove();}
function renderLogin(){S=null;document.getElementById('app').innerHTML=`<main class="login"><section class="login-left"><div class="brand"><span class="brand-mark">OS</span><div><div class="brand-title">ONE SOURCE</div><div class="brand-sub">BUSINESS WORKSPACE</div></div></div><div class="login-copy"><div class="eyebrow">YOUR BUSINESS. BETTER CONNECTED.</div><h1>Every enquiry.<br>Every ceiling.<br>Every rupee.</h1><p>A connected workspace for your sales team, store, site engineers and accounts. Built around the way One Source works.</p><div class="login-flow"><span>CRM & quotations</span><span>Materials & sites</span><span>Billing & accounts</span></div></div><div class="login-foot">LOCAL-FIRST &nbsp; / &nbsp; ROLE-BASED ACCESS &nbsp; / &nbsp; AUDIT TRAIL</div></section><section class="login-right"><div class="login-box"><span class="brand-mark">OS</span><h2>Welcome to your workspace.</h2><p>Sign in to bring your sales, projects and accounts into one view.</p><div class="form-error" id="login-error"></div><form class="login-form" id="login-form">${field('username','Username','text','admin',[],{extra:'autocomplete="username"'})}${field('password','Password','password','',[],{extra:'autocomplete="current-password"'})}<button class="btn primary" type="submit">Sign in securely ${ic('arrow')}</button></form><div class="login-note">First time here? Your generated administrator password appears in the server terminal when you start the app.<br><br>This is an internal pilot build, not a certified statutory accounting system.</div></div></section></main>`;}

document.addEventListener('submit',async e=>{if(!['login-form','modal-form'].includes(e.target.id))return;e.preventDefault();const form=e.target,button=form.querySelector('button[type="submit"]');button.disabled=true;const values=Object.fromEntries(new FormData(form).entries());try{if(form.id==='login-form'){const r=await api('/api/login','POST',values);CSRF=r.csrf;S=await api('/api/state');render();}else if(modalSubmit){await modalSubmit(values);}}catch(err){const box=document.getElementById(form.id==='login-form'?'login-error':'form-error');if(box){box.style.display='block';box.textContent=err.message;box.scrollIntoView({block:'nearest'});}else toast(err.message,true);}finally{if(button.isConnected)button.disabled=false;}});
document.addEventListener('input',e=>{if(e.target.id==='global-search'){query=e.target.value;renderContent();}if(e.target.closest('.doc-line'))updateEstimate();if(e.target.closest('.journal-line'))updateJournalBalance();});
document.addEventListener('change',e=>{if(e.target.classList.contains('item-select')){const row=e.target.closest('.doc-line'),i=find('items',e.target.value),type=document.getElementById('doc-line-body').dataset.type;row.querySelector('.doc-rate').value=(['bill','purchase_order'].includes(type)?i.buy_rate:i.sell_rate)/100;row.querySelector('.doc-gst').value=i.gst_bps/100;updateEstimate();}if(e.target.name==='tax_mode')updateEstimate();if(e.target.name==='document_id'&&e.target.closest('#modal-form')){const d=find('documents',e.target.value);if(d){const form=e.target.closest('form');form.querySelector('[name="direction"]').value=d.type==='bill'?'out':'in';form.querySelector('[name="cash"]').value=(form.querySelector('[name="bucket"]').value==='retention'?d.retained:d.outstanding)/100;}}if(e.target.name==='bucket'){const form=e.target.closest('form'),d=find('documents',form.querySelector('[name="document_id"]')?.value);if(e.target.value==='advance'){form.querySelector('[name="document_id"]').value='';for(const name of ['tds','retention','advance_used'])form.querySelector(`[name="${name}"]`).value=0;}else if(d)form.querySelector('[name="cash"]').value=(e.target.value==='retention'?d.retained:d.outstanding)/100;}});
document.addEventListener('click',async e=>{const target=e.target.closest('[data-action]');if(!target)return;const a=target.dataset.action,id=target.dataset.id,x=target.dataset.extra;try{switch(a){case 'nav':closeModal();navigate(id,x);break;case 'tab':tabs[page]=id;renderContent();break;case 'menu':document.getElementById('sidebar').classList.toggle('open');break;case 'refresh':await refresh();toast(PREVIEW?'Preview data is fixed. Start the full app for live updates.':'Workspace refreshed.');break;case 'edit-master':{const record=find(x,id),pre={...record};if(x==='items'){pre.sell_rate=record.sell_rate/100;pre.buy_rate=record.buy_rate/100;pre.gst_rate=record.gst_bps/100;pre.reorder=record.reorder_milli/1000;}newMaster(x,pre,Number(id));break;}case 'toggle-user':confirmAction('Update team access','Disabling an account immediately invalidates its active sessions.',{action:'toggle_user',id:Number(id),active:Number(x)});break;case 'commercial-form':commercialForm(x||id,x?Number(id):null);break;case 'new':newMaster(id);break;case 'edit-status':editStatus(x,Number(id));break;case 'lead-detail':leadDetail(Number(id));break;case 'project-detail':projectDetail(Number(id));break;case 'party-detail':partyDetail(Number(id));break;case 'doc-detail':docDetail(Number(id));break;case 'new-doc':newDoc(id);break;case 'quote-lead':newDoc('quote',Number(id));break;case 'close-modal':closeModal();break;case 'add-doc-line':addDocLine();break;case 'remove-line':target.closest('tr').remove();updateEstimate();updateJournalBalance();break;case 'approve-doc':confirmAction('Approve commercial document','Approve this quotation / order for the next workflow step. Approval itself creates no accounting posting.',{action:'approve_document',id:Number(id)});break;case 'convert-order':confirmAction('Convert quotation to sales order','Create one linked sales-order draft with the quotation\u2019s items, quantities and terms.',{action:'convert_document',id:Number(id),target:'sales_order'});break;case 'post-doc':confirmAction('Post document to the accounts','This records revenue / purchases, tax working and the party balance. Review the document before posting. Posted entries cannot be edited.',{action:'post_document',id:Number(id)});break;case 'cancel-doc':confirmAction('Cancel draft','The cancelled draft remains visible for traceability. Only drafts can be cancelled.',{action:'cancel_draft',id:Number(id)});break;case 'dispatch-form':orderMovement(Number(id),'dispatch');break;case 'receive-form':orderMovement(Number(id),'receive');break;case 'invoice-from-order':orderMovement(Number(id),'invoice');break;case 'bill-receipt':billReceipt(Number(id));break;case 'pod-form':podForm(Number(id));break;case 'stock-form':stockForm(id);break;case 'settlement-form':settlementForm(id);break;case 'reverse-form':reverseForm(x,Number(id));break;case 'journal-form':journalForm();break;case 'add-journal-line':addJournalLine();break;case 'journal-detail':journalDetail(Number(id));break;case 'ledger':ledgerDetail(id);break;case 'post-labour':confirmAction('Accrue project labour','Post headcount \u00d7 daily rate as labour expense and labour payable. This is not a cash payment.',{action:'post_labour',id:Number(id)});break;case 'complete-task':await mutate({action:'update',entity:'tasks',id:Number(id),status:'Done'});break;case 'settings-form':settingsForm();break;case 'user-form':userForm();break;case 'password-form':passwordForm();break;case 'upload-form':uploadForm(x,Number(id));break;case 'print-doc':printDoc(Number(id));break;case 'backup':download('/api/backup');break;case 'export':download('/api/export?dataset='+encodeURIComponent(id));break;case 'attachment':download('/api/attachment/'+id);break;case 'logout':if(PREVIEW){toast('You are exploring the read-only preview.');break;}await api('/api/logout','POST',{});closeModal();renderLogin();break;}}catch(err){toast(err.message,true);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.matches('[role="button"][data-action]'))e.target.click();if(e.key==='Tab'&&document.querySelector('.modal')){const elems=[...document.querySelectorAll('.modal button:not([disabled]),.modal input:not([disabled]),.modal select:not([disabled]),.modal textarea:not([disabled]),.modal a[href]')].filter(el=>el.offsetParent!==null);if(!elems.length)return;const first=elems[0],last=elems[elems.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
(async function boot(){page=TITLES[location.hash.slice(1)]?location.hash.slice(1):'dashboard';if(PREVIEW){S=window.OS_PREVIEW;render();return;}try{const session=await api('/api/session');CSRF=session.csrf;S=await api('/api/state');render();}catch(e){renderLogin();}})();

function commercial(){const tab=tabs.commercial||'ra';const records=tab==='ra'?S.measurements:S.credit_instruments;return head('Certify the work. Track the collection.','Running-account measurements and letters of credit, connected to project control.',can('accounts','operations')?btn(tab==='ra'?'New measurement':'New LC record','commercial-form',tab==='ra'?'measurements':'credit_instruments','primary','plus'):'','COMMERCIAL / CERTIFICATION & LC')+tabbar([['ra','Measurement & RA register'],['lc','Letters of credit']],'ra')+(tab==='ra'?`<section class="card">${table(['Project / work','Reference','Status','>Executed','>Measured','>Certified','>Certified value',''],records,r=>`<tr><td>${E(project(r.project_id))}<div class="sub">${E(r.zone)} / ${E(r.description)}</div></td><td>${E(r.reference)}<div class="sub">${r.invoice_id?E(find('documents',r.invoice_id)?.number):'Not linked to invoice'}</div></td><td>${badge(r.status)}</td><td class="right">${Q(r.executed_milli)} ${E(r.uom)}</td><td class="right">${Q(r.measured_milli)}</td><td class="right">${Q(r.certified_milli)}</td><td class="right bold">${R(r.value)}</td><td>${btn('Review','commercial-form',r.id,'sm','edit','measurements')}</td></tr>`)}</section>`:`<section class="card">${table(['LC / customer','Bank / project','Maturity','Status','>Face value','>Claimed','>Accepted',''],records,r=>`<tr><td>${E(r.reference)}<div class="sub">${E(party(r.party_id))}</div></td><td>${E(r.bank)}<div class="sub">${E(project(r.project_id))}</div></td><td class="${r.due_date<S.today&&!['Settled','Expired'].includes(r.status)?'negative':''}">${datef(r.due_date)}</td><td>${badge(r.status)}</td><td class="right">${R(r.face_value)}</td><td class="right">${R(r.claim_value)}</td><td class="right bold">${R(r.accepted_value)}</td><td>${btn('Review','commercial-form',r.id,'sm','edit','credit_instruments')}</td></tr>`)}</section>`)+`<div style="margin-top:16px">${notice(tab==='ra'?'Certified quantity cannot exceed measured or executed quantity. Billed records require a linked posted project invoice. This register does not create invoices, WIP entries or revenue automatically.':'LC status is a commercial tracker, not a bank transaction. Record actual collections under Billing and Collections; discounting, bank charges and finance entries need separate accountant-reviewed postings.','warning')}</div>`;}
function commercialForm(entity,id=null){const obj=id?find(entity,id):{};const ra=entity==='measurements';const val=(key,fallback='')=>obj?.[key]??fallback;let fields='';if(ra){fields=field('project_id','Project','select',val('project_id'),S.projects.map(p=>[p.id,p.name]))+field('date','Measurement date','date',val('date',S.today))+field('zone','Floor / area / zone','text',val('zone'))+field('description','Work description','text',val('description'))+field('uom','Quantity unit','select',val('uom','SQM'),['SQM','SFT','NOS','RMT','JOB'])+field('rate','Agreed unit rate (INR)','number',val('rate',0)/100)+field('executed','Executed quantity','number',val('executed_milli',0)/1000,[],{step:'.001'})+field('measured','Measured quantity','number',val('measured_milli',0)/1000,[],{step:'.001'})+field('certified','Certified quantity (accounts approval)','number',val('certified_milli',0)/1000,[],{step:'.001'})+field('status','Status','select',val('status','Draft'),['Draft','Submitted','Certified','Billed'])+field('invoice_id','Posted invoice (required for Billed)','select',val('invoice_id'),[['','Not yet invoiced'],...S.documents.filter(d=>d.type==='invoice'&&d.status==='Posted').map(d=>[d.id,d.number+' | '+project(d.project_id)])],{required:false,full:true})+field('reference','RA bill / client certificate reference','text',val('reference'),[],{required:false});}else{fields=field('party_id','Customer','select',val('party_id'),partyOptions('Customer'))+field('project_id','Project (optional)','select',val('project_id'),projectOptions(),{required:false})+field('reference','Unique LC reference','text',val('reference'))+field('bank','Issuing bank','text',val('bank'))+field('issue_date','Issue date','date',val('issue_date',S.today))+field('due_date','Maturity date','date',val('due_date',S.today))+field('face_value','LC face value (INR)','number',val('face_value',0)/100)+field('claim_value','Claim submitted (INR)','number',val('claim_value',0)/100)+field('accepted_value','Claim accepted (INR)','number',val('accepted_value',0)/100)+field('status','Status','select',val('status','Proposed'),['Proposed','Issued','Submitted','Accepted','Discounted','Settled','Expired']);}fields+=field('owner','Responsible person','text',val('owner',S.user.name))+field('notes','Evidence / next action / remarks','textarea',val('notes'),[],{required:false,full:true});formModal((id?'Update ':'New ')+(ra?'measurement / certification':'LC control record'),`<div class="form-grid">${fields}</div><div style="margin-top:16px">${notice('This is a commercial control register. Saving it does not post financial entries. Accounts approval is required for certification and LC records.')}</div>`,data=>mutate({action:'commercial_record',entity,id,...data}),true,'Save commercial record');}

</script>
